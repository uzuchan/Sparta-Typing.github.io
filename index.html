<!doctype html>
<html lang="ja" data-mode="practice">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="description" content="英単語タイピング学習アプリ — type, master, advance." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>Sparta Typing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const isDevHost = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);

      async function loadBuiltApp() {
        const stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = "./assets/main-CMoGIL0p.css";
        document.head.append(stylesheet);

        await import(/* @vite-ignore */ "./assets/main-_qOAkfQo.js");
      }

      if (isDevHost) {
        try {
          await import("/src/main.tsx");
        } catch {
          await loadBuiltApp();
        }
      } else {
        await loadBuiltApp();
      }
    </script>
  </body>
</html>
